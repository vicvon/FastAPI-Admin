apiVersion: v1
kind: ConfigMap
metadata:
  name: fastapi-admin-config
  labels:
    app.kubernetes.io/name: fastapi-admin
    app.kubernetes.io/component: api
data:
  APP_NAME: "FastAPI-Admin"
  DEBUG: "false"
  EXPOSE_ERROR_DETAIL: "false"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_MINUTES: "10080"
  ALGORITHM: "HS256"
  TOKEN_ISSUER: "FastAPI-Admin"
  TOKEN_AUDIENCE: "FastAPI-Admin"
  SNOWFLAKE_NODE_ID: "0"
  SNOWFLAKE_EPOCH_MS: "1767196800000"
  REDIS__MODE: "standalone"
  REDIS__URL: "redis://redis.default.svc.cluster.local:6379/0"
  REDIS__PASSWORD: ""
  REDIS__PREFIX: "fastapi-admin:"
  REDIS__SOCKET_TIMEOUT: "5"
  REDIS__MAX_CONNECTIONS: "10"
  CAPTCHA__ENABLED: "true"
  CAPTCHA__TTL_SECONDS: "300"
  CAPTCHA__LENGTH: "4"
  CAPTCHA__MAX_ATTEMPTS: "5"
  LOG__LEVEL: "INFO"
  LOG__CONSOLE_ENABLED: "true"
  LOG__FILE_ENABLED: "false"
  LOG__DIRECTORY: "logs"
  LOG__FILENAME: "app.log"
  LOG__RETENTION: "30 days"
  LOG__ROTATION: "100 MB"
---
apiVersion: v1
kind: Secret
metadata:
  name: fastapi-admin-secrets
  labels:
    app.kubernetes.io/name: fastapi-admin
    app.kubernetes.io/component: api
type: Opaque
stringData:
  DATABASE_URL: "mysql+aiomysql://root:change-me@mysql.default.svc.cluster.local:3306/fastapi_admin"
  SECRET_KEY: "change-me-in-production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-admin-api
  labels:
    app.kubernetes.io/name: fastapi-admin
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fastapi-admin
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fastapi-admin
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: your-registry/fastapi-admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: fastapi-admin-config
            - secretRef:
                name: fastapi-admin-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-admin-api
  labels:
    app.kubernetes.io/name: fastapi-admin
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: fastapi-admin
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
